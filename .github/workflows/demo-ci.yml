name: AutoFix Backend Demo CI

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]

permissions:
  contents: read

jobs:
  demo-api:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out demo branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Compile isolated demo API
        run: python -m compileall -q app/demo_api.py

      - name: Lint isolated demo API
        run: ruff check app/demo_api.py demo_tests

      - name: Test isolated in-memory API
        run: pytest -q demo_tests
