name: AutoFix Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autofix
          POSTGRES_PASSWORD: autofix
          POSTGRES_DB: autofix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autofix -d autofix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend with test dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Run migrations against PostgreSQL
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://autofix:autofix@localhost:5432/autofix_test
          SECRET_KEY: ci-only-autofix-secret
          APP_ENV: test
          BCRYPT_ROUNDS: "4"

      - name: Run backend test suite
        run: pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://autofix:autofix@localhost:5432/autofix_test
          SECRET_KEY: ci-only-autofix-secret
          APP_ENV: test
          BCRYPT_ROUNDS: "4"
