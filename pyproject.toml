[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autofix"
version = "0.1.0"
description = "AutoFix - Auto Repair Garage Management & Operations Platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    # Dev tools
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "DTZ",  # flake8-datetimez
]
ignore = [
    # FastAPI resolves dependencies by putting calls in parameter defaults
    # (`session: AsyncSession = Depends(get_session)`). That is the framework's
    # documented idiom and appears on nearly every route in this codebase, so
    # B008 here is noise rather than a mutable-default warning worth fixing.
    "B008",
    # No formatter is configured for this repo, so line length is not
    # machine-enforced and E501 would only add churn.
    "E501",
    # Every enum here is declared as `class X(str, Enum)` on purpose. StrEnum
    # changes what str() returns, and these values are stored in plain String
    # columns and serialized straight to JSON, so the mixin form is what keeps
    # the wire format identical to the stored value.
    "UP042",
    # Raising inside an `except` block without `from` is pervasive in the
    # service and schema layers, and the correct fix is not mechanical: several
    # of these wrap database errors that must NOT reach the client, so each site
    # needs `from None` where it currently has nothing. Worth doing properly
    # rather than blanket-applying.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Logging is configured before the routers are imported so that anything logged
# during module import is formatted by the configured handlers. The import
# order is load-bearing, not accidental.
"app/main.py" = ["E402"]
# Demo data deliberately builds dates relative to the server's local day, which
# is the right notion of "today" for a garage calendar fixture.
"app/core/demo_data.py" = ["DTZ011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
plugins = []
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
