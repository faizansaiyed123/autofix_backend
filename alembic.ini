[alembic]
script_location = alembic
prepend_sys.path = backend
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
revision_length = 4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
handlers =
level = WARN
qualname = sqlalchemy.engine

[logger_alembic]
handlers =
level = INFO
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
